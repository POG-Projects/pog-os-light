; PogLight - controleur autonome de bandes LED pour ESP32
; Build : PlatformIO (VS Code) -> Upload -> Monitor (115200 bauds)
;
; Trois cibles :
;   pio run -e esp32dev    -> ESP32 classique (puce USB-UART CP2102/CH340)
;   pio run -e esp32s3     -> ESP32-S3 (USB natif)
;   pio run -e esp32c3     -> ESP32-C3 SuperMini (USB natif)
; Choisis l'environnement correspondant a ta carte.

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Table custom avec 2 slots OTA (maj WiFi). nvs garde le meme offset -> config preservee.
board_build.partitions = partitions_ota.csv
lib_deps =
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
    olikraus/U8g2@^2.35.19
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; FastLED + WiFi : limite les interruptions qui peuvent faire scintiller la bande
    -DFASTLED_RMT_MAX_CHANNELS=1
    -DFASTLED_ESP32_FLASH_LOCK=1

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DPOGLIGHT_HEADLESS=1

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; USB natif du S3 : expose le port serie (logs visibles dans le monitor)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini : controle web sans ecran ni boutons tactiles.
; La cible generique DevKitM-1 correspond au module C3/4 Mo du SuperMini.
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DPOGLIGHT_HEADLESS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEFAULT_LED_PIN=2
